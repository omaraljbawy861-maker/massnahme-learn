<script>
const bank={"B1":[{"title":"العمل والتقديم على وظيفة","heading":"Arbeit und Bewerbung","text":"Bei der Jobsuche ist es wichtig, die Stellenanzeige genau zu lesen. In einer Bewerbung beschreibt man seine Erfahrungen und erklärt, warum man für die Stelle geeignet ist. Nach dem Vorstellungsgespräch sollte man sich für die Einladung bedanken.","ar":"عند البحث عن عمل من المهم قراءة الإعلان بعناية. في طلب العمل تشرح خبراتك وسبب ملاءمتك للوظيفة.","vocab":[["die Stellenanzeige","إعلان الوظيفة"],["die Erfahrung","الخبرة"],["die Bewerbung","طلب التوظيف"],["geeignet","مناسب"],["die Einladung","الدعوة"]],"sentences":[["Ich bewerbe mich um die Stelle als Verkäufer.","أتقدم لوظيفة بائع."],["Ich habe bereits Erfahrung in diesem Bereich.","لدي خبرة سابقة في هذا المجال."],["Könnten Sie mir einen Termin anbieten?","هل يمكنكم إعطائي موعداً؟"]],"q":"Warum ist es wichtig, die Stellenanzeige genau zu lesen?","a":"Damit man die Anforderungen versteht."},{"title":"السكن والجيران","heading":"Wohnen und Nachbarschaft","text":"In einem Mehrfamilienhaus wohnen Menschen mit unterschiedlichen Gewohnheiten. Rücksichtnahme ist deshalb besonders wichtig. Wenn es ein Problem mit der Heizung gibt, sollte man den Vermieter schriftlich informieren und den Schaden genau beschreiben.","ar":"في المباني المشتركة يجب مراعاة الجيران. عند وجود عطل بالتدفئة يُفضّل إبلاغ المؤجر كتابياً مع وصف المشكلة.","vocab":[["der Vermieter","المؤجر"],["die Heizung","التدفئة"],["der Schaden","العطل"],["die Rücksichtnahme","مراعاة الآخرين"],["schriftlich","كتابياً"]],"sentences":[["Die Heizung funktioniert seit gestern nicht.","التدفئة لا تعمل منذ أمس."],["Ich möchte den Schaden melden.","أريد الإبلاغ عن العطل."],["Wir sollten Rücksicht auf die Nachbarn nehmen.","علينا مراعاة الجيران."]],"q":"Wen sollte man bei einem Heizungsproblem informieren?","a":"Den Vermieter."},{"title":"الصحة والمواعيد","heading":"Gesundheit und Termine","text":"Wer krank ist, sollte seine Beschwerden möglichst genau beschreiben. In einer Arztpraxis fragt man nach einem Termin und bringt wichtige Unterlagen mit. Falls man einen Termin nicht wahrnehmen kann, sollte man rechtzeitig absagen.","ar":"من المهم وصف الأعراض بوضوح وحجز موعد عند الطبيب وإلغاء الموعد مسبقاً إذا تعذر الحضور.","vocab":[["die Beschwerde","العَرَض الصحي"],["die Arztpraxis","عيادة الطبيب"],["rechtzeitig","في الوقت المناسب"],["absagen","يلغي"],["die Unterlage","الوثيقة"]],"sentences":[["Ich habe seit drei Tagen Kopfschmerzen.","أعاني من صداع منذ ثلاثة أيام."],["Kann ich einen Termin vereinbaren?","هل يمكنني حجز موعد؟"],["Leider muss ich den Termin absagen.","للأسف يجب أن ألغي الموعد."]],"q":"Was soll man tun, wenn man einen Termin nicht wahrnehmen kann?","a":"Rechtzeitig absagen."},{"title":"التعليم والتدريب المهني","heading":"Schule und Ausbildung","text":"Eine Ausbildung verbindet praktische Arbeit im Betrieb mit Unterricht in der Berufsschule. Auszubildende lernen einen Beruf Schritt für Schritt. Wer Fragen hat, kann mit seiner Ausbilderin oder seinem Ausbilder sprechen.","ar":"يجمع التدريب المهني بين العمل العملي في الشركة والدراسة في المدرسة المهنية.","vocab":[["die Ausbildung","التدريب المهني"],["der Betrieb","الشركة"],["die Berufsschule","المدرسة المهنية"],["der Auszubildende","المتدرب"],["der Ausbilder","المشرف على التدريب"]],"sentences":[["Ich interessiere mich für eine Ausbildung.","أنا مهتم بتدريب مهني."],["Der Unterricht findet in der Berufsschule statt.","تجري الدراسة في المدرسة المهنية."],["Ich möchte mich über die Voraussetzungen informieren.","أريد معرفة الشروط."]],"q":"Wo findet der theoretische Unterricht statt?","a":"In der Berufsschule."},{"title":"المواصلات والسفر","heading":"Verkehr und Reisen","text":"Wer mit öffentlichen Verkehrsmitteln reist, sollte die Verbindung und die Abfahrtszeit vorher prüfen. Bei einer Verspätung kann man nach einer anderen Verbindung fragen. Eine gute Reiseplanung spart Zeit und vermeidet Stress.","ar":"عند استخدام النقل العام يجب التحقق من الرحلة ووقت الانطلاق ومعرفة البدائل عند التأخير.","vocab":[["die Verbindung","خط المواصلات"],["die Abfahrt","المغادرة"],["die Verspätung","التأخير"],["umsteigen","يبدّل وسيلة النقل"],["die Fahrkarte","التذكرة"]],"sentences":[["Wann fährt der nächste Zug ab?","متى ينطلق القطار التالي؟"],["Muss ich in Köln umsteigen?","هل يجب أن أبدّل في كولن؟"],["Der Bus hat zwanzig Minuten Verspätung.","الحافلة متأخرة عشرين دقيقة."]],"q":"Warum sollte man die Abfahrtszeit prüfen?","a":"Um die Reise besser zu planen."},{"title":"الرسائل الرسمية","heading":"Formelle E-Mails","text":"Eine formelle E-Mail beginnt mit einem klaren Betreff und einer höflichen Anrede. Im Hauptteil erklärt man den Grund der Nachricht und formuliert eine konkrete Bitte. Zum Schluss bedankt man sich und verwendet eine passende Grußformel.","ar":"تبدأ الرسالة الرسمية بعنوان واضح وتحية مهذبة، ثم سبب الرسالة والطلب وخاتمة رسمية.","vocab":[["der Betreff","موضوع الرسالة"],["die Anrede","التحية"],["die Bitte","الطلب"],["die Grußformel","الخاتمة"],["höflich","مهذب"]],"sentences":[["Sehr geehrte Damen und Herren,","السيدات والسادة المحترمون،"],["Ich schreibe Ihnen, weil ich eine Frage habe.","أكتب إليكم لأن لدي سؤالاً."],["Mit freundlichen Grüßen","مع أطيب التحيات"]],"q":"Was gehört an den Anfang einer formellen E-Mail?","a":"Ein Betreff und eine höfliche Anrede."},{"title":"قواعد: الجمل الثانوية","heading":"Nebensätze mit weil, dass und obwohl","text":"Nebensätze beginnen häufig mit einer Konjunktion. Das konjugierte Verb steht im Nebensatz am Ende. Weil nennt einen Grund, dass leitet eine Aussage ein und obwohl beschreibt einen Gegensatz.","ar":"في الجملة الثانوية يأتي الفعل المصرف في النهاية. weil للسبب وdass لنقل المعلومة وobwohl للتناقض.","vocab":[["weil","لأن"],["dass","أنّ"],["obwohl","رغم أن"],["der Nebensatz","الجملة الثانوية"],["die Konjunktion","أداة الربط"]],"sentences":[["Ich lerne, weil ich die Prüfung bestehen möchte.","أدرس لأنني أريد النجاح بالامتحان."],["Ich glaube, dass der Kurs hilfreich ist.","أعتقد أن الدورة مفيدة."],["Obwohl es regnet, gehe ich spazieren.","رغم المطر سأتمشى."]],"q":"Wo steht das konjugierte Verb im Nebensatz?","a":"Am Ende."},{"title":"إبداء الرأي والنقاش","heading":"Meinung und Diskussion","text":"In einer Diskussion sollte man die eigene Meinung verständlich ausdrücken und andere ausreden lassen. Ein gutes Argument enthält eine Behauptung und eine Begründung. Beispiele machen die Argumentation überzeugender.","ar":"في النقاش عبّر عن رأيك بوضوح واحترم الآخرين وادعم كلامك بسبب ومثال.","vocab":[["meiner Meinung nach","برأيي"],["das Argument","الحجة"],["die Begründung","التبرير"],["zustimmen","يوافق"],["widersprechen","يعارض"]],"sentences":[["Meiner Meinung nach ist Lesen wichtig.","برأيي القراءة مهمة."],["Ich stimme dir teilweise zu.","أوافقك جزئياً."],["Ein Beispiel dafür ist der Schulalltag.","مثال على ذلك الحياة المدرسية."]],"q":"Was macht ein Argument überzeugender?","a":"Eine Begründung und ein Beispiel."}],"B2":[{"title":"العمل عن بعد والتوازن","heading":"Homeoffice und Work-Life-Balance","text":"Die Möglichkeit, von zu Hause aus zu arbeiten, kann die Vereinbarkeit von Beruf und Privatleben verbessern. Allerdings verschwimmen dadurch manchmal die Grenzen zwischen Arbeitszeit und Freizeit. Unternehmen sollten daher klare Regeln zur Erreichbarkeit vereinbaren.","ar":"قد يساعد العمل عن بعد في التوازن بين الحياة والعمل، لكنه قد يجعل الحدود بين وقت العمل والراحة غير واضحة.","vocab":[["die Vereinbarkeit","التوفيق بين أمرين"],["verschwimmen","تتلاشى الحدود"],["die Erreichbarkeit","إمكانية التواصل"],["allerdings","لكن"],["die Grenze","الحد"]],"sentences":[["Einerseits spart man Zeit, andererseits fehlt der persönliche Kontakt.","من جهة نوفر الوقت ومن جهة نفتقد التواصل المباشر."],["Klare Regeln können Konflikte vermeiden.","القواعد الواضحة تمنع الخلافات."],["Die Vorteile hängen von der Tätigkeit ab.","تعتمد الفوائد على نوع العمل."]],"q":"Welches Problem kann im Homeoffice entstehen?","a":"Die Grenzen zwischen Arbeitszeit und Freizeit verschwimmen."},{"title":"الإعلام والمعلومات المضللة","heading":"Medien und Desinformation","text":"Soziale Netzwerke ermöglichen es, Informationen in Sekundenschnelle zu verbreiten. Doch nicht jede Behauptung ist ausreichend belegt. Um Desinformation zu erkennen, sollte man die ursprüngliche Quelle prüfen, den Kontext berücksichtigen und verschiedene seriöse Berichte vergleichen.","ar":"تنشر الشبكات الاجتماعية الأخبار بسرعة، لكن يجب التحقق من المصدر والسياق ومقارنة مصادر موثوقة.","vocab":[["die Behauptung","الادعاء"],["belegen","يثبت بدليل"],["die Quelle","المصدر"],["berücksichtigen","يأخذ بالحسبان"],["die Desinformation","التضليل"]],"sentences":[["Diese Behauptung ist nicht ausreichend belegt.","هذا الادعاء غير مثبت بما يكفي."],["Man sollte mehrere Quellen miteinander vergleichen.","ينبغي مقارنة عدة مصادر."],["Der Kontext spielt eine entscheidende Rolle.","السياق يلعب دوراً حاسماً."]],"q":"Wie kann man Desinformation besser erkennen?","a":"Durch Quellenprüfung und den Vergleich seriöser Berichte."},{"title":"البيئة والاستدامة","heading":"Umwelt und Nachhaltigkeit","text":"Nachhaltiger Konsum bedeutet, bei Kaufentscheidungen nicht nur den Preis, sondern auch Herstellung, Lebensdauer und Umweltfolgen zu berücksichtigen. Reparatur und Wiederverwendung können Ressourcen schonen. Trotzdem sind auch politische und wirtschaftliche Maßnahmen erforderlich.","ar":"الاستهلاك المستدام يراعي طريقة الإنتاج والعمر والأثر البيئي، وليس السعر فقط.","vocab":[["der Ressourcenverbrauch","استهلاك الموارد"],["die Herstellung","التصنيع"],["die Lebensdauer","العمر الافتراضي"],["erforderlich","ضروري"],["die Wiederverwendung","إعادة الاستخدام"]],"sentences":[["Langlebige Produkte können Ressourcen sparen.","المنتجات المعمرة توفر الموارد."],["Nicht nur Verbraucher tragen Verantwortung.","ليست المسؤولية على المستهلك وحده."],["Diese Maßnahme wäre langfristig sinnvoll.","هذا الإجراء مفيد على المدى الطويل."]],"q":"Welche Faktoren gehören zu nachhaltigem Konsum?","a":"Herstellung, Lebensdauer und Umweltfolgen."},{"title":"التعليم وتكافؤ الفرص","heading":"Bildung und Chancengleichheit","text":"Bildung eröffnet berufliche und gesellschaftliche Perspektiven. Allerdings hängen die Lernbedingungen häufig von sozialen und wirtschaftlichen Faktoren ab. Zusätzliche Förderung, zugängliche Materialien und individuelle Beratung können dazu beitragen, Benachteiligungen abzubauen.","ar":"التعليم يفتح الفرص، لكن ظروف التعلم قد تتأثر بالعوامل الاجتماعية والاقتصادية، لذا يفيد الدعم المخصص.","vocab":[["die Chancengleichheit","تكافؤ الفرص"],["die Förderung","الدعم التعليمي"],["die Benachteiligung","الحرمان من الفرص"],["zugänglich","متاح"],["abbauen","يقلل"]],"sentences":[["Bildung sollte für alle zugänglich sein.","يجب أن يكون التعليم متاحاً للجميع."],["Gezielte Förderung kann Nachteile ausgleichen.","الدعم الموجه يعوض بعض الفوارق."],["Die Ursachen sind vielfältig.","الأسباب متعددة."]],"q":"Was kann Benachteiligungen abbauen?","a":"Zusätzliche Förderung und zugängliche Materialien."},{"title":"كتابة مقال حجاجي","heading":"Erörterung und Stellungnahme","text":"Eine überzeugende Stellungnahme beginnt mit einer klaren Fragestellung. Im Hauptteil werden Argumente logisch geordnet, begründet und mit Beispielen gestützt. Im Schluss fasst man die wichtigsten Gedanken zusammen und formuliert eine nachvollziehbare Position.","ar":"المقال الحجاجي يبدأ بسؤال واضح ثم حجج مرتبة مدعومة بأمثلة ويختتم بموقف منطقي.","vocab":[["die Erörterung","المناقشة الحجاجية"],["nachvollziehbar","قابل للفهم"],["stützen","يدعم"],["zusammenfassen","يلخص"],["die Fragestellung","السؤال المحوري"]],"sentences":[["Zunächst möchte ich die Vorteile erläutern.","أود أولاً توضيح الإيجابيات."],["Ein wesentliches Gegenargument lautet ...","هناك حجة مضادة مهمة تقول..."],["Zusammenfassend lässt sich feststellen, dass ...","خلاصة القول إنه..."]],"q":"Was gehört in den Hauptteil einer Erörterung?","a":"Geordnete und begründete Argumente mit Beispielen."},{"title":"اللغة الرسمية والتفاوض","heading":"Formelle Kommunikation und Verhandlung","text":"In schwierigen Gesprächen ist es hilfreich, sachlich zu bleiben und die Interessen beider Seiten zu berücksichtigen. Statt Vorwürfe zu formulieren, sollte man konkrete Beobachtungen nennen und konstruktive Lösungsvorschläge machen. Ein Kompromiss muss nicht jede Forderung vollständig erfüllen.","ar":"في المفاوضات من الأفضل البقاء موضوعياً وفهم مصالح الطرفين وتقديم حلول عملية.","vocab":[["sachlich","موضوعي"],["der Vorwurf","الاتهام"],["der Kompromiss","التسوية"],["der Lösungsvorschlag","اقتراح الحل"],["die Forderung","المطلب"]],"sentences":[["Ich kann Ihren Standpunkt nachvollziehen.","أستطيع تفهم وجهة نظركم."],["Wäre ein Kompromiss denkbar?","هل يمكن التفكير بحل وسط؟"],["Ich schlage eine alternative Lösung vor.","أقترح حلاً بديلاً."]],"q":"Was ist in schwierigen Gesprächen hilfreich?","a":"Sachlich bleiben und konstruktive Lösungen vorschlagen."},{"title":"السبب والنتيجة والمبني للمجهول","heading":"Passiv und komplexe Satzverbindungen","text":"Das Passiv stellt die Handlung oder das Ergebnis in den Vordergrund. In komplexen Texten helfen Verknüpfungen wie infolgedessen, während und dennoch, Ursachen, Gegensätze und Folgen präzise darzustellen.","ar":"المبني للمجهول يركز على الحدث أو النتيجة، وأدوات الربط المتقدمة توضّح السبب والتناقض والنتيجة.","vocab":[["das Passiv","المبني للمجهول"],["infolgedessen","ونتيجة لذلك"],["während","بينما"],["dennoch","مع ذلك"],["die Folge","النتيجة"]],"sentences":[["Die Unterlagen werden morgen verschickt.","ستُرسل الأوراق غداً."],["Es regnete stark; dennoch fand die Veranstaltung statt.","هطل المطر بقوة ومع ذلك أقيم الحدث."],["Die Nachfrage stieg; infolgedessen wurden mehr Stellen geschaffen.","زاد الطلب ولذلك أُنشئت وظائف أكثر."]],"q":"Was steht beim Passiv im Vordergrund?","a":"Die Handlung oder das Ergebnis."},{"title":"تحليل النصوص وتلخيصها","heading":"Textanalyse und Zusammenfassung","text":"Bei einer Textanalyse unterscheidet man zwischen Hauptaussage, Argumentationsstruktur und sprachlicher Gestaltung. Eine Zusammenfassung gibt die wesentlichen Inhalte sachlich und in eigenen Worten wieder. Persönliche Bewertungen gehören nur in eine ausdrücklich verlangte Stellungnahme.","ar":"في تحليل النص نميز بين الفكرة الرئيسية وبنية الحجج والأسلوب، أما التلخيص فيعرض الأفكار الأساسية بحياد.","vocab":[["die Hauptaussage","الفكرة الرئيسية"],["die Argumentationsstruktur","بنية الحجج"],["die Gestaltung","الصياغة"],["sachlich","بموضوعية"],["wiedergeben","يعيد عرض"]],"sentences":[["Der Autor vertritt die Auffassung, dass ...","يرى الكاتب أن..."],["Im Mittelpunkt des Textes steht ...","يتمحور النص حول..."],["Abschließend wird betont, dass ...","في الختام يتم التأكيد على..."]],"q":"Was sollte eine sachliche Zusammenfassung vermeiden?","a":"Persönliche Bewertungen."}]};let level=new URLSearchParams(location.search).get("level")==="B2"?"B2":"B1";let index=0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function speak(s){if(!("speechSynthesis" in window))return alert("النطق غير مدعوم في هذا المتصفح");speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang="de-DE";u.rate=.78;speechSynthesis.speak(u)}
function render(){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.level===level));const lessons=bank[level];document.querySelector("#stats").innerHTML='<span class="stat">📖 '+lessons.length+' دروس مكثفة</span><span class="stat">🗣️ '+lessons.reduce((n,x)=>n+x.sentences.length,0)+' جملة مع النطق</span><span class="stat">🧠 '+lessons.reduce((n,x)=>n+x.vocab.length,0)+' كلمة ومصطلح</span><span class="stat">📄 '+lessons.length+' نصوص للقراءة</span>';
document.querySelector("#units").innerHTML=lessons.map((l,i)=>'<button class="unit '+(i===index?"active":"")+'" data-unit="'+i+'">'+(i+1)+'. '+esc(l.title)+'</button>').join("");
const l=lessons[index];document.querySelector("#lesson").innerHTML='<span class="tag">'+level+' · Lektion '+(index+1)+'</span><h2>'+esc(l.title)+'</h2><p class="de">'+esc(l.heading)+'</p><h3>📄 نص القراءة · Lesetext <button class="speak" id="read">🔊 استمع للنص</button></h3><div class="reading"><p class="de">'+esc(l.text)+'</p><p>'+esc(l.ar)+'</p></div><h3>🧠 كلمات ومفردات · Wortschatz</h3><table><thead><tr><th>Deutsch</th><th>العربية</th><th>استماع</th></tr></thead><tbody>'+l.vocab.map((v,i)=>'<tr><td class="de">'+esc(v[0])+'</td><td>'+esc(v[1])+'</td><td><button class="speak" data-v="'+i+'">🔊</button></td></tr>').join("")+'</tbody></table><h3>🗣️ جمل عملية · Beispielsätze</h3>'+l.sentences.map((s,i)=>'<div class="sentence"><div><div class="de">'+esc(s[0])+'</div><small>'+esc(s[1])+'</small></div><button class="speak" data-s="'+i+'">🔊</button></div>').join("")+'<h3>✍️ فهم النص · Leseverstehen</h3><details><summary>'+esc(l.q)+' · اضغط لعرض الإجابة</summary><p class="de">'+esc(l.a)+'</p></details><h3>📝 واجب كتابي · Schreibaufgabe</h3><p>اكتب فقرة بالألمانية من '+(level==="B1"?"80 إلى 120":"150 إلى 200")+' كلمة عن موضوع «'+esc(l.heading)+'». استخدم خمس كلمات من الدرس وثلاث جمل جديدة من تأليفك.</p><button class="tab" id="next">الدرس التالي ←</button>';
document.querySelector("#read").onclick=()=>speak(l.text);document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>speak(l.vocab[Number(b.dataset.v)][0]));document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>speak(l.sentences[Number(b.dataset.s)][0]));document.querySelector("#next").onclick=()=>{index=(index+1)%lessons.length;render();window.scrollTo({top:0,behavior:"smooth"})};document.querySelectorAll("[data-unit]").forEach(b=>b.onclick=()=>{index=Number(b.dataset.unit);render()});}
document.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>{level=b.dataset.level;index=0;history.replaceState(null,"","?level="+level);render()});render();
</script></body></html>
