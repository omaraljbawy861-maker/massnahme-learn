name: Build MAßNAHME LEARN APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.html"
      - "css/**"
      - "js/**"
      - "data/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare complete web app
        run: |
          mkdir -p www
          find . -maxdepth 1 -type f -name "*.html" -exec cp {} www/ \;
          for dir in css js data assets; do
            if [ -d "$dir" ]; then cp -R "$dir" www/; fi
          done
          test -f www/index.html
          test -f www/chat.html

      - name: Install Capacitor dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Sync all web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: massnahme-learn-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
